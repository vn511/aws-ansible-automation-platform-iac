---
plugin: amazon.aws.aws_ec2
regions:
  - us-east-1
filters:
  instance-state-name: running
keyed_groups:
  - key: tags.Environment
    prefix: env
  - key: tags.OS
    prefix: os
  - key: tags.PatchGroup
    prefix: patch
  - key: tags.Application
    prefix: app
hostnames:
  - private-ip-address
compose:
  ansible_host: private_ip_address
strict: false
