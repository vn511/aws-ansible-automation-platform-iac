---
name: Validate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Ansible validators
        run: python -m pip install ansible-core ansible-lint yamllint
      - name: Install Ansible collections
        run: ansible-galaxy collection install -r ansible/requirements.yml
      - name: Check Terraform formatting
        run: terraform fmt -check -recursive
      - name: Initialize Terraform without backend or credentials
        run: terraform -chdir=terraform/environments/dev init -backend=false -input=false
      - name: Validate Terraform
        run: terraform -chdir=terraform/environments/dev validate
      - name: Lint YAML
        run: yamllint .
      - name: Lint Ansible playbooks
        run: ansible-lint ansible/playbooks
